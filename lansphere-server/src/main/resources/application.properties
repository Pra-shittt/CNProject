# ============================
# LanSphere Server Configuration
# ============================

spring.application.name=LanSphere

# ---- Server ----
server.port=8080
server.servlet.context-path=/api

# ---- SQLite ----
spring.datasource.url=jdbc:sqlite:lansphere.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=./uploads

# ---- JWT ----
app.jwt.secret=LanSphereSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024!
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Local Networking Engine ----
# All running LAN nodes must share this secret to exchange encrypted TCP packets.
app.network.enabled=true
app.network.discovery-port=39393
app.network.tcp-port=39394
app.network.discovery-interval-ms=5000
app.network.heartbeat-interval-ms=3000
app.network.heartbeat-timeout-ms=12000
app.network.socket-timeout-ms=5000
app.network.transfer-chunk-size=65536
app.network.transfer-directory=./network-transfers
app.network.shared-secret=change-this-lansphere-network-secret

# ---- Logging ----
logging.level.root=INFO
logging.level.com.lansphere=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
